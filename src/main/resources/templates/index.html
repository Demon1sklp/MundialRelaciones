<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Club - Formulario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div th:replace="~{fragmentos/encabezado :: encabezado}"></div>

  <div class="container mt-4 mb-5">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card shadow">
          <div class="card-header bg-primary text-white">
            <h4 class="mb-0"
                th:text="${club.id == null} ? 'Nuevo club' : 'Editar club'">Club</h4>
          </div>
          <div class="card-body">

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form th:action="@{/guardar}" th:object="${club}" method="post">
              <input type="hidden" th:field="*{id}">

              <div class="row">
                <div class="col-md-6 mb-3">
                  <label class="form-label">Nombre del club</label>
                  <input type="text" class="form-control" th:field="*{nombre}" required>
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label">Ciudad</label>
                  <input type="text" class="form-control" th:field="*{ciudad}" required>
                </div>
              </div>

              <!-- Uno a uno -->
              <div class="mb-3">
                <label class="form-label">Entrenador (uno a uno)</label>
                <select name="entrenadorId" class="form-select">
                  <option value="">-- Sin entrenador --</option>
                  <option th:each="e : ${entrenadores}"
                          th:value="${e.id}"
                          th:text="|${e.nombre} ${e.apellido} (${e.nacionalidad})|"
                          th:selected="${club.entrenador != null and club.entrenador.id == e.id}">
                  </option>
                </select>
              </div>

              <!-- Muchos a uno -->
              <div class="mb-3">
                <label class="form-label">Asociacion (muchos a uno)</label>
                <select name="asociacionId" class="form-select">
                  <option value="">-- Sin asociacion --</option>
                  <option th:each="a : ${asociaciones}"
                          th:value="${a.id}"
                          th:text="|${a.nombre} - ${a.pais}|"
                          th:selected="${club.asociacion != null and club.asociacion.id == a.id}">
                  </option>
                </select>
              </div>

              <!-- Uno a muchos -->
              <div class="mb-3">
                <label class="form-label">Jugadores (uno a muchos)</label>
                <select name="jugadoresIds" class="form-select" multiple size="6">
                  <option th:each="j : ${jugadores}"
                          th:value="${j.id}"
                          th:text="|${j.numero} - ${j.nombre} ${j.apellido} (${j.posicion})|"
                          th:selected="${club.jugadores != null and club.jugadores.![id].contains(j.id)}">
                  </option>
                </select>
                <div class="form-text">Mantén Ctrl para elegir varios.</div>
              </div>

              <!-- Muchos a muchos -->
              <div class="mb-3">
                <label class="form-label">Competiciones (muchos a muchos)</label>
                <select name="competicionesIds" class="form-select" multiple size="4">
                  <option th:each="c : ${competiciones}"
                          th:value="${c.id}"
                          th:text="${c.nombre}"
                          th:selected="${club.competiciones != null and club.competiciones.![id].contains(c.id)}">
                  </option>
                </select>
                <div class="form-text">Mantén Ctrl para elegir varias.</div>
              </div>

              <button type="submit" class="btn btn-success">Guardar</button>
              <a th:href="@{/listar}" class="btn btn-secondary">Ver lista</a>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
