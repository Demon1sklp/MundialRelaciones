<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Club - Listado</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div th:replace="~{fragmentos/encabezado :: encabezado}"></div>

  <div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3>Listado de clubes</h3>
      <a th:href="@{/}" class="btn btn-primary">+ Nuevo club</a>
    </div>

    <div th:if="${#lists.isEmpty(clubes)}" class="alert alert-info">
      No hay clubes registrados.
    </div>

    <div class="table-responsive" th:unless="${#lists.isEmpty(clubes)}">
      <table class="table table-striped table-hover shadow bg-white align-middle">
        <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Club</th>
            <th>Ciudad</th>
            <th>Entrenador</th>
            <th>Asociacion</th>
            <th>Jugadores</th>
            <th>Competiciones</th>
            <th class="text-center">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="c : ${clubes}">
            <td th:text="${c.id}">1</td>
            <td th:text="${c.nombre}">Club</td>
            <td th:text="${c.ciudad}">Ciudad</td>

            <td>
              <span th:if="${c.entrenador != null}"
                    th:text="|${c.entrenador.nombre} ${c.entrenador.apellido}|">Entrenador</span>
              <span th:if="${c.entrenador == null}" class="text-muted">Sin entrenador</span>
            </td>

            <td>
              <span th:if="${c.asociacion != null}" th:text="${c.asociacion.nombre}">Asociacion</span>
              <span th:if="${c.asociacion == null}" class="text-muted">Sin asociacion</span>
            </td>

            <td>
              <span th:each="j : ${c.jugadores}"
                    class="badge text-bg-secondary me-1"
                    th:text="|${j.numero} - ${j.nombre} ${j.apellido}|">Jugador</span>
              <span th:if="${#lists.isEmpty(c.jugadores)}" class="text-muted">Sin jugadores</span>
            </td>

            <td>
              <span th:each="comp : ${c.competiciones}"
                    class="badge text-bg-info me-1"
                    th:text="${comp.nombre}">Competicion</span>
              <span th:if="${#lists.isEmpty(c.competiciones)}" class="text-muted">Ninguna</span>
            </td>

            <td class="text-center text-nowrap">
              <a th:href="@{/editar/{id}(id=${c.id})}" class="btn btn-warning btn-sm">Editar</a>
              <a th:href="@{/eliminar/{id}(id=${c.id})}" class="btn btn-danger btn-sm"
                 onclick="return confirm('Eliminar este club?')">Eliminar</a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
